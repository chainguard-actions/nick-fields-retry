name: Test retry_on timeout - only retry on timeout not on error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          max_attempts: 3
          timeout_seconds: 30
          retry_wait_seconds: 1
          retry_on: timeout
          command: exit 1
      - name: Assert action failed without retrying (error, not timeout)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL_ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total_attempts: $TOTAL_ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome=failure (retry_on=timeout, but got error), got '$OUTCOME'"
            exit 1
          fi
          # Should fail on first attempt without retrying since retry_on=timeout but command errored
          if [ "$TOTAL_ATTEMPTS" != "1" ]; then
            echo "FAIL: expected total_attempts=1 (no retry for error when retry_on=timeout), got '$TOTAL_ATTEMPTS'"
            exit 1
          fi
          echo "PASS"
