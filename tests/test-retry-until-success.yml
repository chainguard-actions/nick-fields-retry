name: Test retry until success
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reset counter
        run: rm -f /tmp/retry-counter
      - id: action
        uses: .
        with:
          timeout_seconds: 30
          max_attempts: 5
          retry_wait_seconds: 1
          command: |
            n=$(cat /tmp/retry-counter 2>/dev/null || echo 0)
            n=$((n+1))
            echo "$n" > /tmp/retry-counter
            echo "attempt $n"
            if [ "$n" -lt 3 ]; then exit 1; fi
            echo "succeeded"
      - name: Assert outputs
        env:
          ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "total_attempts: $ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          echo "counter: $(cat /tmp/retry-counter)"
          if [ "$ATTEMPTS" != "3" ]; then
            echo "FAIL: expected total_attempts 3"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit_code 0"
            exit 1
          fi
          if [ "$(cat /tmp/retry-counter)" != "3" ]; then
            echo "FAIL: expected counter 3"
            exit 1
          fi
          echo "PASS"
