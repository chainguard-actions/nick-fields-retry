name: Test retry on error - command fails then succeeds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up attempt counter file
        run: |
          echo "0" > /tmp/attempt_count.txt
      - id: action
        uses: .
        with:
          max_attempts: 3
          timeout_seconds: 30
          retry_wait_seconds: 1
          command: |
            count=$(cat /tmp/attempt_count.txt)
            count=$((count + 1))
            echo "$count" > /tmp/attempt_count.txt
            echo "Attempt $count"
            if [ "$count" -lt 2 ]; then
              echo "Failing on attempt $count"
              exit 1
            fi
            echo "Succeeding on attempt $count"
      - name: Assert retried and succeeded
        env:
          TOTAL_ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "total_attempts: $TOTAL_ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          if [ "$TOTAL_ATTEMPTS" != "2" ]; then
            echo "FAIL: expected total_attempts=2, got '$TOTAL_ATTEMPTS'"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit_code=0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"
