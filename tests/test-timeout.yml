name: Test timeout - command times out and is retried
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Initialize attempt counter
        run: echo "0" > /tmp/timeout_attempt.txt
      - id: action
        uses: .
        with:
          max_attempts: 3
          timeout_seconds: 3
          retry_wait_seconds: 1
          polling_interval_seconds: 1
          command: |
            count=$(cat /tmp/timeout_attempt.txt)
            count=$((count + 1))
            echo "$count" > /tmp/timeout_attempt.txt
            if [ "$count" -lt 2 ]; then
              echo "Sleeping to trigger timeout on attempt $count"
              sleep 10
            fi
            echo "Completed quickly on attempt $count"
      - name: Assert timed out and retried successfully
        env:
          TOTAL_ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "total_attempts: $TOTAL_ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          if [ "$TOTAL_ATTEMPTS" != "2" ]; then
            echo "FAIL: expected total_attempts=2 (timeout on first, success on second), got '$TOTAL_ATTEMPTS'"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit_code=0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"
