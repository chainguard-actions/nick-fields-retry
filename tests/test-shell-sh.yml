name: Test shell sh
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare
        run: rm -f /tmp/shell-sh-out.txt
      - id: action
        uses: .
        with:
          timeout_seconds: 30
          max_attempts: 1
          shell: sh
          command: echo shell-ok > /tmp/shell-sh-out.txt
      - name: Assert command ran with sh
        env:
          ACTUAL: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "total_attempts: $ACTUAL"
          echo "exit_code: $EXIT_CODE"
          cat /tmp/shell-sh-out.txt || true
          if [ "$ACTUAL" != "1" ]; then
            echo "FAIL: expected 1 attempt"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit_code 0"
            exit 1
          fi
          if [ "$(cat /tmp/shell-sh-out.txt)" != "shell-ok" ]; then
            echo "FAIL: output file content mismatch"
            exit 1
          fi
          echo "PASS"
