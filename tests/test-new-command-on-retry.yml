name: Test new_command_on_retry input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: exit 1
          new_command_on_retry: echo "retry command succeeded"
          max_attempts: 2
          retry_wait_seconds: 1
      - name: Assert new command ran on retry
        env:
          TOTAL: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "total_attempts: $TOTAL"
          echo "exit_code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit_code=0, got $EXIT_CODE"
            exit 1
          fi
          if [ "$TOTAL" != "2" ]; then
            echo "FAIL: expected total_attempts=2, got $TOTAL"
            exit 1
          fi
          echo "PASS"
