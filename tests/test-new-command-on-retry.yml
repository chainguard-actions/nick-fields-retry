name: Test new_command_on_retry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reset marker
        run: rm -f /tmp/new-cmd-marker
      - id: action
        uses: .
        with:
          timeout_seconds: 30
          max_attempts: 3
          retry_wait_seconds: 1
          command: exit 1
          new_command_on_retry: echo ran > /tmp/new-cmd-marker
      - name: Assert outputs
        env:
          ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "total_attempts: $ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          if [ "$ATTEMPTS" != "2" ]; then
            echo "FAIL: expected total_attempts 2"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit_code 0"
            exit 1
          fi
          if [ "$(cat /tmp/new-cmd-marker)" != "ran" ]; then
            echo "FAIL: new_command_on_retry did not run"
            exit 1
          fi
          echo "PASS"
