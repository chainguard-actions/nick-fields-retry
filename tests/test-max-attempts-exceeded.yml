name: Test max attempts exceeded - command always fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          max_attempts: 2
          timeout_seconds: 30
          retry_wait_seconds: 1
          command: exit 1
      - name: Assert action failed after max attempts
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOTAL_ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total_attempts: $TOTAL_ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome=failure, got '$OUTCOME'"
            exit 1
          fi
          if [ "$TOTAL_ATTEMPTS" != "2" ]; then
            echo "FAIL: expected total_attempts=2, got '$TOTAL_ATTEMPTS'"
            exit 1
          fi
          if [ "$EXIT_CODE" != "1" ]; then
            echo "FAIL: expected exit_code=1, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"
