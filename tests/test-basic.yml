name: Test basic usage - command succeeds first attempt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          max_attempts: 3
          timeout_seconds: 30
          command: echo "hello world"
      - name: Assert total_attempts is 1
        env:
          TOTAL_ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "total_attempts: $TOTAL_ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          if [ "$TOTAL_ATTEMPTS" != "1" ]; then
            echo "FAIL: expected total_attempts=1, got '$TOTAL_ATTEMPTS'"
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "FAIL: expected exit_code=0, got '$EXIT_CODE'"
            exit 1
          fi
          echo "PASS"
