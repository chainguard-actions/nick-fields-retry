name: Test retry_on_exit_code stops on other codes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timeout_seconds: 30
          max_attempts: 3
          retry_wait_seconds: 1
          retry_on_exit_code: 2
          continue_on_error: true
          command: exit 5
      - name: Assert no retry
        env:
          ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          CODE: ${{ steps.action.outputs.exit_code }}
          ERR: ${{ steps.action.outputs.exit_error }}
        run: |
          echo "attempts=$ATTEMPTS code=$CODE err=$ERR"
          [ "$ATTEMPTS" = "1" ] || { echo "FAIL: expected 1 attempt"; exit 1; }
          [ "$CODE" = "5" ] || { echo "FAIL: expected exit_code 5"; exit 1; }
          echo "PASS"
