name: Test retry_on_exit_code stops on non-matching code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          timeout_seconds: 30
          max_attempts: 3
          retry_wait_seconds: 1
          retry_on_exit_code: 1
          continue_on_error: true
          command: exit 2
      - name: Assert no retry happened
        env:
          ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "total_attempts: $ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          if [ "$ATTEMPTS" != "1" ]; then
            echo "FAIL: expected total_attempts 1"
            exit 1
          fi
          if [ "$EXIT_CODE" != "2" ]; then
            echo "FAIL: expected exit_code 2"
            exit 1
          fi
          echo "PASS"
