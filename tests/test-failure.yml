name: Test failing command fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          timeout_seconds: 30
          max_attempts: 2
          retry_wait_seconds: 1
          command: exit 3
      - name: Assert step failed
        env:
          ATTEMPTS: ${{ steps.action.outputs.total_attempts }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "total_attempts: $ATTEMPTS"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome failure"
            exit 1
          fi
          if [ "$ATTEMPTS" != "2" ]; then
            echo "FAIL: expected total_attempts 2"
            exit 1
          fi
          if [ "$EXIT_CODE" != "3" ]; then
            echo "FAIL: expected exit_code 3"
            exit 1
          fi
          echo "PASS"
